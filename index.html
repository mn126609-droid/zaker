<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/zaker/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="مذاكرة تفاعلية لمحاضرات الكتابة التقنية والـ Soft Skills: شرح، خلاصة، اقتباسات وكويزات.">
  <meta name="theme-color" content="#4F63D9">

  <!-- iOS: "Add to Home Screen" -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="zakerGPT">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>zakerGPT</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F8F6F1; }
    @media (prefers-color-scheme: dark) { html, body { background: #14161C; } }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, "Segoe UI", Tahoma, sans-serif; color: #4F63D9;
      transition: opacity .35s ease;
    }
    #splash img { width: 96px; height: 96px; border-radius: 26px; box-shadow: 0 12px 30px rgba(79,99,217,.25); }
    #splash .bar { width: 120px; height: 5px; border-radius: 5px; background: rgba(79,99,217,.15); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 5px; background: #4F63D9;
      animation: slide 1s ease-in-out infinite alternate;
    }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-150%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>

  <script>
    // Install support: keep the browser's install prompt so the app can show its own button.
    (function () {
      var deferred = null;
      function notify() { if (typeof window.__pwaNotify === 'function') window.__pwaNotify(); }
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        notify();
      });
      window.addEventListener('appinstalled', function () { deferred = null; notify(); });
      window.pwaCanInstall = function () { return deferred !== null; };
      window.pwaIsStandalone = function () {
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      };
      window.pwaIsIos = function () {
        return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      };
      window.pwaInstall = function () {
        if (!deferred) return Promise.resolve('unavailable');
        var e = deferred;
        deferred = null;
        e.prompt();
        return e.userChoice.then(function (c) { notify(); return c.outcome; });
      };
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
      }
      // Hide the splash once Flutter draws its first frame.
      window.addEventListener('flutter-first-frame', function () {
        var s = document.getElementById('splash');
        if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 400); }
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
